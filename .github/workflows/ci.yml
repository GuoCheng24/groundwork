name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}

      - name: Git identity for the pre-registration tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - name: Install
        run: python -m pip install -e .

      - name: Tests
        run: python -m unittest discover -s tests -v

      # Installed into a clean environment and run from somewhere else entirely.
      # A quickstart that only works in the directory its author was standing in
      # is a quickstart nobody can follow.
      - name: Stranger test - install and run from an unrelated directory
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install -q .
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/fresh/bin/groundwork | head -3
          /tmp/fresh/bin/groundwork gate --baseline 0.50 --oracle 0.75 --se 0.011
          # the stages must be inside the wheel: a stranger who cloned, installed
          # and ran this from a project directory could not find them when they
          # lived at the repository root, and this is the one command whose whole
          # job is to attach the pipeline to an agent
          /tmp/fresh/bin/groundwork install --list | grep -q 00-gate
          /tmp/fresh/bin/groundwork install
          test -L .claude/skills/groundwork-00-gate
          /tmp/fresh/bin/groundwork ledger kill --id ci --cause ceiling-too-low \
              --what "a check that the taxonomy ships with the package" \
              --settled-by "this step"
          test -f archive/killed.json

      # A gate that has never been seen refusing is decoration.
      - name: The gate passes a direction with room
        run: python -m groundwork gate --baseline 0.50 --oracle 0.75 --se 0.011

      - name: The gate refuses a direction without room
        run: |
          if python -m groundwork gate --baseline 0.812 --oracle 0.830 --se 0.019; then
            echo "::error::the gate passed a direction with 0.95 SE of headroom"
            exit 1
          fi


      # The watcher's own failure mode: a process that has exited and not been
      # reaped still answers os.kill(pid, 0), so the first version of this tool
      # called a dead job alive. Both directions are checked.
      - name: watch calls a job that died at once dead, not alive
        run: |
          mkdir -p /tmp/wproj && cd /tmp/wproj
          # NOT `| tee`: a pipeline's status is the LAST command's, so piping
          # through tee reports tee's success and hides the exit code being
          # tested. This step failed that way on its first run.
          if python -m groundwork watch start --name dead --alive-after 3 --force \
               -- python -c "raise SystemExit('weights not found')" > /tmp/w.txt 2>&1; then
            cat /tmp/w.txt
            echo "::error::a job that died before the check was reported as started"; exit 1
          fi
          cat /tmp/w.txt
          grep -q "ALREADY GONE" /tmp/w.txt
          grep -q "weights not found" /tmp/w.txt
          test -f archive/runs/dead.DONE

      - name: watch reports an OOM in the log rather than a clean end
        run: |
          cd /tmp/wproj
          python -m groundwork watch start --name oom --alive-after 2 --force \
            -- python -u -c "print('step 1'); raise MemoryError('CUDA out of memory')" || true
          if python -m groundwork watch status --name oom > /tmp/o.txt 2>&1; then
            cat /tmp/o.txt
            echo "::error::an OOM in the log was reported as a clean end"; exit 1
          fi
          cat /tmp/o.txt
          grep -q "TROUBLE IN THE LOG" /tmp/o.txt

      # A sweep that reports a pass because there was nothing to check has told
      # you the opposite of the truth, so the empty case is the one CI pins.
      - name: check reports n/a on an empty project, and does not fail it
        run: |
          mkdir -p /tmp/cproj && cd /tmp/cproj
          python -m groundwork init --name ci
          python -m groundwork check > /tmp/c.txt; cat /tmp/c.txt
          grep -q "not applicable" /tmp/c.txt
          grep -q "is not a pass" /tmp/c.txt
          # The private scan legitimately passes on an empty project - it
          # really did scan and find nothing. The gates must not: there is
          # nothing for them to have looked at.
          if grep -qE "^  ok +(gate|prereg|prereg-order|noise|ledger|runs) " /tmp/c.txt; then
            echo "::error::a gate reported a pass with nothing to check"; exit 1
          fi
          grep -qE "^  n/a +gate " /tmp/c.txt
          grep -qE "^  n/a +prereg " /tmp/c.txt

      - name: check fails a project with results and no pre-registration
        run: |
          cd /tmp/cproj && mkdir -p results
          echo '{"acc": 0.5}' > results/metrics_run1.json
          if python -m groundwork check > /tmp/c2.txt; then
            echo "::error::results with no pre-registration passed"; cat /tmp/c2.txt; exit 1
          fi
          grep -q "FAIL  prereg" /tmp/c2.txt

      # An exemption that disarms a check without saying why is how a repository
      # stops checking itself. An entry with no reason must waive nothing.
      - name: a waiver with no reason waives nothing
        run: |
          cd /tmp/cproj && mkdir -p archive
          echo '{"prereg": ""}' > archive/waivers.json
          if python -m groundwork check > /tmp/c3.txt; then
            echo "::error::an empty reason disarmed the check"; exit 1
          fi
          # record a real gate so the sweep can come out clean, rather than
          # teaching that everything gets waived
          python -m groundwork gate --baseline 0.50 --oracle 0.75 --se 0.011 --record
          printf '{"prereg": "a demonstration, not a test against a threshold",\n "noise": "the comparison is bit-exact, not scored"}\n' > archive/waivers.json
          python -m groundwork check > /tmp/c4.txt; cat /tmp/c4.txt
          grep -q "a demonstration, not a test against a threshold" /tmp/c4.txt
          grep -q "2 waived" /tmp/c4.txt
          grep -q "ok    gate" /tmp/c4.txt

      - name: probe says where it looked when it says not found
        run: |
          python -m groundwork probe --root /nonexistent-root --search-seconds 5 > /tmp/p.txt
          cat /tmp/p.txt
          grep -q "statement about PATH" /tmp/p.txt

      # The failure this exists for is silent: a shard that died leaves a hole
      # no shard file reports, and a disagreement gets deduped away. Both must
      # exit non-zero.
      - name: shard merge refuses a hole and a disagreement
        run: |
          mkdir -p /tmp/sproj && cd /tmp/sproj
          printf '{"id":"q1","ans":"A"}\n' > a.jsonl
          printf '{"id":"q2","ans":"B"}\n' > b.jsonl
          python -m groundwork shard merge a.jsonl b.jsonl --expect 2 -o merged.jsonl
          test "$(wc -l < merged.jsonl)" = "2"
          if python -m groundwork shard merge a.jsonl b.jsonl --expect 3 > /tmp/s1.txt 2>&1; then
            cat /tmp/s1.txt; echo "::error::a missing item was merged silently"; exit 1
          fi
          grep -q "SHORT BY 1" /tmp/s1.txt
          printf '{"id":"q1","ans":"DIFFERENT"}\n' > c.jsonl
          if python -m groundwork shard merge a.jsonl c.jsonl > /tmp/s2.txt 2>&1; then
            cat /tmp/s2.txt; echo "::error::two answers for one id were deduped"; exit 1
          fi
          grep -q "DIFFERENT CONTENT" /tmp/s2.txt

      - name: The exact tests reproduce published figures
        run: python -m groundwork stats selftest

      - name: A scorer that never moves is reported as not moving
        run: |
          python -m groundwork noise --n 3 --command 'python -c "print(\"acc 0.75\")"' > /tmp/n.txt
          cat /tmp/n.txt
          grep -q "Nothing moved" /tmp/n.txt

      - name: A scoring command that fails is not a measurement
        run: |
          if python -m groundwork noise --n 2 --command 'python -c "import sys;sys.exit(3)"'; then
            echo "::error::a failing scorer was accepted as a measurement"; exit 1
          fi

      - name: init scaffolds a project whose gate section is first and empty
        run: |
          mkdir -p /tmp/proj && cd /tmp/proj
          python -m groundwork init --name "ci"
          test -d prereg && test -d archive
          head -20 PROJECT.md | grep -q "The gate"

      - name: install lists every stage
        run: python -m groundwork install --list | grep -c "^  [0-9]" | grep -q 7

      # The sweep is run over this repository on every push. A tool that its own
      # project does not pass is a tool nobody else should be asked to run.
      # Eleven links in the README and the tutorial pointed at a path that had
      # not existed since `skills/` moved into the package - including every
      # link in the first stage's row. A dead link on the front page is the
      # first thing a visitor finds.
      - name: Every relative link resolves
        run: |
          python - <<'PY'
          import os, re, sys
          bad, n = [], 0
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [d for d in dirnames if d not in {".git", "node_modules", "__pycache__"}]
              for f in filenames:
                  if not f.endswith(".md"):
                      continue
                  p = os.path.join(dirpath, f)
                  text = open(p, encoding="utf-8", errors="replace").read()
                  for m in re.finditer(r"\[[^\]]*\]\(([^)\s]+)\)", text):
                      t = m.group(1)
                      if t.startswith(("http://", "https://", "#", "mailto:")):
                          continue
                      n += 1
                      if not os.path.exists(os.path.normpath(os.path.join(dirpath, t.split("#")[0]))):
                          bad.append(f"{p}:{text[:m.start()].count(chr(10)) + 1} -> {t}")
          print(f"{n} relative link(s) checked")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: groundwork check passes on groundwork
        run: python -m groundwork check

      - name: The archive is well-formed and every cause names a gate
        run: |
          python - <<'PY'
          import json, os, sys
          d = json.load(open("archive/causes-of-death.json"))
          causes = d["causes"]
          assert len({c["id"] for c in causes}) == len(causes), "duplicate cause id"
          bad = []
          for c in causes:
              for k in ("name", "what_happened", "cheap_test", "gate", "rule", "cost_when_missed"):
                  if not c.get(k):
                      bad.append(f"{c['id']}: empty {k}")
              stage = c["gate"].split("/")[0]
              if not os.path.isdir(os.path.join("groundwork", "skills", stage)):
                  bad.append(f"{c['id']}: gate {c['gate']} names no stage under skills/")
          print(f"{len(causes)} causes checked")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      # A file nobody links to is a file nobody reads. Every note in a stage
      # directory has to be reachable from that stage's SKILL.md.
      - name: No orphaned skill files
        run: |
          python - <<'PY'
          import glob, os, re, sys
          bad = []
          for stage in sorted(glob.glob("groundwork/skills/*/")):
              main = os.path.join(stage, "SKILL.md")
              if not os.path.exists(main):
                  bad.append(f"{stage}: no SKILL.md"); continue
              body = open(main, encoding="utf-8").read()
              linked = set(re.findall(r"\]\(([^)]+\.md)\)", body))
              for f in sorted(glob.glob(os.path.join(stage, "*.md"))):
                  name = os.path.basename(f)
                  if name == "SKILL.md":
                      continue
                  if name not in linked:
                      bad.append(f"{f} is not linked from {main}")
          print(f"{len(glob.glob('groundwork/skills/*/*.md'))} skill files checked")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: Every stage skill has frontmatter and a trigger list
        run: |
          python - <<'PY'
          import glob, sys
          bad = []
          files = sorted(glob.glob("groundwork/skills/*/SKILL.md"))
          for f in files:
              s = open(f, encoding="utf-8").read()
              if not s.startswith("---\n"):
                  bad.append(f"{f}: no frontmatter")
              if "Triggers:" not in s and "triggers:" not in s:
                  bad.append(f"{f}: no triggers in the description")
          print(f"{len(files)} stage skills checked")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY
