[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-research"
version = "0.1.2"
description = "The research pipeline for coding agents that spends its first ten minutes trying to kill your project: a gate that returns NO-GO, a pre-registration version control can date, and an archive of how directions actually die."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Guo Cheng"}]
keywords = ["research", "agents", "llm", "claude-code", "codex", "reproducibility",
            "pre-registration", "experiment-design", "research-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  # CI runs 3.9 and 3.13; 3.14 verified locally. PyPI filters on these, and a
  # package that lists none is a package nobody can filter to.
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GuoCheng24/groundwork"
"Getting started" = "https://github.com/GuoCheng24/groundwork/blob/main/docs/getting-started.md"
"上手指南 (中文)" = "https://github.com/GuoCheng24/groundwork/blob/main/docs/getting-started.zh.md"
Source = "https://github.com/GuoCheng24/groundwork"
Issues = "https://github.com/GuoCheng24/groundwork/issues"

[project.scripts]
groundwork = "groundwork.cli:main"

[tool.setuptools]
packages = ["groundwork"]

[tool.setuptools.package-data]
groundwork = ["causes-of-death.json", "skills/*/*.md"]
